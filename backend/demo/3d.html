<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BetaCrux 3D wall</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* the product's palette (frontend/src/index.css): paper, ink, sage */
  html, body { margin:0; height:100%; background:#f1f7ed; color:#243e36; font:14px/1.4 "Barlow",ui-sans-serif,system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 16px; border-bottom:1px solid #d2e2cb; background:#f8fbf5; }
  header b { font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:22px; letter-spacing:.02em; color:#243e36; margin-right:6px; }
  header button, header select { font:inherit; font-size:14px; font-weight:600; color:#243e36; background:#fff; border:1px solid #d2e2cb;
    border-radius:999px; padding:6px 14px; cursor:pointer; }
  header button.on { background:#243e36; color:#f1f7ed; border-color:#243e36; }
  header label { font-size:14px; display:flex; align-items:center; gap:8px; color:#5a6e66; }
  header input[type=range] { width:120px; accent-color:#3f7a55; }
  #status { color:#5a6e66; font-size:13px; margin-left:auto; }
  #status.err { color:#b5452f; }
  #stage { flex:1; min-height:0; position:relative; }
  #guide { position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:5; display:none; padding:12px 18px;
    background:#f8fbf5; border:1px solid #d2e2cb; border-radius:14px; box-shadow:0 8px 28px rgba(36,62,54,.14); font-size:15px; text-align:center; }
  #guide.on { display:block; }
  #guide .step { color:#3f7a55; font-weight:700; margin-right:8px; }
  #guide button { margin-left:10px; font:inherit; font-size:14px; font-weight:600; color:#f1f7ed; background:#243e36; border:0; border-radius:999px; padding:6px 14px; cursor:pointer; }
  #guide button.ghost { color:#243e36; background:transparent; border:1px solid #d2e2cb; }
</style>
</head>
<body>
<header>
  <b>BetaCrux</b>
  <select id="wallpick" title="Which wall to look at">
    <option value="/demo/walls/wall-1.jpg" data-wall-m="4.3">Wall 1</option>
    <option value="/demo/walls/wall-2.jpg" data-wall-m="4.0">Wall 2</option>
  </select>
  <button id="pick" title="Choose which climb to work out, and where it starts and ends">Pick a climb</button>
  <label title="The climber's height: 1.40 m to 2.10 m">Height <input id="height" type="range" min="1.4" max="2.1" step="0.05" value="1.75"> <span id="heightv">1.75 m</span></label>
  <select id="strength" title="How strong the climber's grip is">
    <option value="0.7">Beginner</option>
    <option value="1.0" selected>Regular climber</option>
    <option value="1.25">Strong</option>
    <option value="1.5">Very strong</option>
  </select>
  <span id="status">Loading…</span>
</header>
<div id="stage"><div id="guide"></div></div>
<script type="module">
// The BetaCrux 3D demo. The 3D view itself is one module: viewer/betacrux-viewer.js.
// Address options: ?photo=<url> another wall photo   ?wall_m=<metres> height of wall shown (default 5)
import { mountViewer } from "./viewer/betacrux-viewer.js";

const query = new URLSearchParams(location.search);
const stage = document.getElementById("stage"), status = document.getElementById("status"), guide = document.getElementById("guide");
const say = (text, bad = false) => { status.textContent = text; status.className = bad ? "err" : ""; };
// Height of wall the photo shows, in metres: from the address, else from the chosen wall.
const wallM = () => Number(query.get("wall_m")) || Number(document.getElementById("wallpick").selectedOptions[0]?.dataset.wallM) || 4.3;
let viewer = null, analyze = null, photoUrl = null, picking = null;

const solveReq = (holds, start, finish) => ({ image: analyze.image, holds, start, finish,
  climber_height_m: +document.getElementById("height").value, strength: +document.getElementById("strength").value,
  wall_height_m: wallM(), wall_angle_deg: 0 });
let current = null;      // the request now shown, so height and strength changes can solve it again
async function solve(req) {
  const res = await fetch("/solve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(req) });
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || `the server answered ${res.status}`);
  return body;
}
const byId = (id) => analyze.holds.find((h) => h.id === id);
const groupOf = (h) => h.route === null || h.route === undefined ? [h] : analyze.holds.filter((x) => x.route === h.route);
const reachableFromFloor = (h) => (analyze.image.h - h.y) * wallM() / analyze.image.h <= 1.9;

async function load() {
  photoUrl = query.get("photo") || document.getElementById("wallpick").value;
  say("Finding the holds and the shape of the wall…");
  const blob = await (await fetch(photoUrl)).blob();
  const post = (path) => { const f = new FormData(); f.append("file", blob, "wall.jpg"); return fetch(path, { method: "POST", body: f }); };
  const [found, depth] = await Promise.all([post("/analyze"), post("/depth")]);
  if (!found.ok) throw new Error(`could not find holds (${found.status})`);
  analyze = await found.json();
  const reliefUrl = depth.ok ? URL.createObjectURL(await depth.blob()) : null;
  // Start on a climb that the app can solve: colourful groups first, then the tallest.
  let first = null;
  const routes = (analyze.routes || []).map((r) => r.holds.map(byId)).filter((hs) => hs.length >= 3)
    .sort((a, b) => {
      const dull = (hs) => ["grey", "white", "black", "brown"].includes(hs[0].color_name) ? 1 : 0;
      const span = (hs) => Math.max(...hs.map((h) => h.y)) - Math.min(...hs.map((h) => h.y));
      return dull(a) - dull(b) || span(b) - span(a);
    });
  for (const hs of routes) {
    const up = [...hs].sort((a, b) => b.y - a.y);
    if (!reachableFromFloor(up[0])) continue;
    const req = solveReq(up, [up[0].id], [up[up.length - 1].id]);
    try { first = { req, out: await solve(req), name: up[0].color_name }; break; } catch { /* try the next */ }
  }
  viewer?.dispose();
  viewer = mountViewer(stage, { imageUrl: photoUrl, reliefUrl, analyze, solveRequest: first?.req || null, solve: first?.out || null,
                                autoplay: true, sway: false, bloom: false, hud: true, mesh: false,
                                theme: query.get("theme") === "neon" ? "neon" : "paper" });
  viewer.on("hold", onHold);
  current = first?.req || null;
  window.viewer = viewer;
  say(first ? `${analyze.holds.length} holds found · showing the ${first.name} climb · click any hold to see it up close`
            : `${analyze.holds.length} holds found · use "Pick a climb" to choose one`);
}

// ---- picking a climb: the climb's holds, then where the hands start, then the top
function showGuide(html, buttons = []) {
  guide.innerHTML = html;
  for (const [label, fn, ghost] of buttons) {
    const b = document.createElement("button");
    b.textContent = label; if (ghost) b.className = "ghost"; b.onclick = fn; guide.appendChild(b);
  }
  guide.classList.add("on");
}
function endPicking() { picking = null; guide.classList.remove("on"); document.getElementById("pick").classList.remove("on"); }
function preview() {
  viewer.pause();
  viewer.setSolve(solveReq(picking.holds, picking.start, picking.finish), null);
}
function startPicking() {
  if (!analyze) return;
  picking = { step: 1, holds: [], start: [], finish: [] };
  document.getElementById("pick").classList.add("on");
  showGuide(`<span class="step">1 of 2</span>Click the hold where the hands start. Its colour picks the climb.`, [["Cancel", cancel, true]]);
}
async function cancel() { endPicking(); await load().catch(fail); }
function onHold(h) {
  if (!picking) return;
  if (picking.step === 1) {
    if (!reachableFromFloor(h)) { say("That hold is too high to start from the ground. Pick a lower one.", true); return; }
    picking.holds = [...groupOf(h)].sort((a, b) => b.y - a.y);
    if (!picking.holds.some((x) => x.id === h.id)) picking.holds.unshift(h);
    picking.start = [h.id];
    picking.step = 2;
    const top = picking.holds.filter((x) => x.id !== h.id).sort((a, b) => a.y - b.y)[0];
    if (top) picking.finish = [top.id];
    preview();
    say("");
    showGuide(`<span class="step">2 of 2</span>Click the top hold, or use the highest hold of this colour. (Click a second low hold to start with one hand on each.)`,
              [["Use the highest", climbIt], ["Cancel", cancel, true]]);
  } else if (picking.step === 2) {
    if (picking.start.includes(h.id)) return;
    if (!picking.holds.some((x) => x.id === h.id)) picking.holds.push(h);
    const startHold = picking.holds.find((x) => x.id === picking.start[0]);
    // A second hold close to the start and low enough: a two-hand start. Otherwise it is the top.
    if (picking.start.length === 1 && reachableFromFloor(h) && Math.abs(h.y - startHold.y) < analyze.image.h * 0.12) {
      picking.start.push(h.id);
      preview();
      return;
    }
    picking.finish = [h.id];
    preview();
    climbIt();
  }
}
async function climbIt() {
  const req = solveReq(picking.holds, picking.start, picking.finish);
  endPicking();
  say("Working out the moves…");
  try {
    const out = await solve(req);
    current = req;
    viewer.setSolve(req, out).play();
    say(`${out.moves.length} moves · click any hold to see it up close`);
  } catch (e) { say(`Could not climb it: ${e.message}`, true); }
}

const fail = (e) => { console.error(e); say(`Could not load: ${e.message}`, true); };
// Changing the climber works the same climb out again.
async function resolve() {
  document.getElementById("heightv").textContent = `${(+document.getElementById("height").value).toFixed(2)} m`;
  if (!current || picking) return;
  const req = solveReq(current.holds, current.start, current.finish);
  say("Working out the moves for this climber…");
  try {
    const out = await solve(req);
    current = req;
    viewer.setSolve(req, out).play();
    const fc = out.physics?.finish_chance;
    say(`${out.moves.length} moves` + (typeof fc === "number" ? ` · ${Math.round(fc * 100)}% chance of reaching the top` : ""));
  } catch (e) { say(`This climber cannot do it: ${e.message}`, true); }
}
document.getElementById("height").oninput = () => { document.getElementById("heightv").textContent = `${(+document.getElementById("height").value).toFixed(2)} m`; };
document.getElementById("height").onchange = resolve;
document.getElementById("strength").onchange = resolve;
window.__pickHold = (h) => onHold(h);   // for automated checks
document.getElementById("pick").onclick = () => (picking ? cancel() : startPicking());
document.getElementById("wallpick").onchange = () => { endPicking(); load().catch(fail); };
load().catch(fail);
</script>
</body>
</html>
